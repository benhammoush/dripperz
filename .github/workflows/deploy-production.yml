# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits structure without comments. Operator acceptance/recovery: docs/delivery.md.
name: Deploy production
on:
  # Shared: production is manual, never triggered by a PR or main push.
  # Run from main with one full merged SHA already delivered successfully to dev.
  workflow_dispatch:
    inputs:
      # Shared: retained dev-delivery evidence is machine-checked; the owner still
      # reviews human acceptance/recovery. A SHA or green PR alone is insufficient.
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
# Shared: source ancestry and retained Actions evidence need read access only.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: reject non-main/unmerged selections and missing/mismatched dev evidence
  # before candidate checks. Verify with production inputs, without deploy secrets,
  # and retain that checked artifact; this job does not request provider mutations.
  # Project: Dripperz's ci:quality/ci:browser/ci:prepare remain the check owners,
  # including three-engine core flows and the focused Chromium hero/WebGL suite.
  # This is the same safety path as dev, not a lighter production test shortcut.
  verify_release:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      # Shared: full immutable pin matches the reusable workflow implementation.
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      source_sha: ${{ inputs.sha }}
      # Shared: select declared production build inputs, not a user-defined target.
      environment: production
      node_version: 24.21.0
  # Shared: only successful release verification unlocks the called deploy job.
  # That job binds GitHub's production environment, where native owner approval,
  # main-only access and no admin bypass must be configured (not defined here).
  # After approval it rechecks dev evidence/source/artifact identity, respects
  # DEPLOY_ENABLED and the target lock, then deploys without rebuilding tested output.
  # Project: scripts/ci-deploy.mjs uses Dripperz's bounded static controller for
  # isolated Vercel upload, identity/routing smoke and retained prior deployment ID.
  # No blind retry/rollback: failed or uncertain outcomes need investigation and
  # a fresh manual dispatch/approval; smoke success is not human acceptance.
  deploy_production:
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: 24.21.0
    # Shared: selected production credentials only; no dev token or extra GitHub PAT.
    # VERCEL_TOKEN deploys; SMOKE_BYPASS optionally permits protected-origin smoke.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
