# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits workflow structure without comments. See docs/delivery.md for operations.
# Shared foundation owns the release sequence; Dripperz owns its tests/adapters.
name: CI
on:
  # Shared: PRs verify only. GitHub's required checks/reviews gate a human merge;
  # this workflow neither merges PRs nor deploys their candidate artifacts.
  pull_request: null
  # Shared: a merge creates a main push. Recheck that exact merged commit before
  # delivering dev; successful PR checks do not replace merged-source checks.
  push:
    branches:
      - main
  # Shared: exact-SHA dev revalidation/recovery, not a production target selector.
  # The source guard requires a full merged SHA; it never resolves a moving tag.
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
# Shared: read source and Actions evidence only; no repository administration.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: the immutable web workflow validates the consumer contract, installs
  # dependencies, runs Dripperz's package hooks and retains the checked artifact.
  # Project: ci:quality covers code/docs lint, formatting, tooling/unit tests,
  # version/types/build, checksum-pinned actionlint and dependency audit.
  # Project: ci:browser runs three-engine core flows, then focused Chromium hero
  # tests (playwright.hero.config.ts, tests/hero/) against that existing build.
  # Project: ci:prepare adds static-output identity; browser tests do not rebuild.
  verify:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      # Shared pin: implementation checkout must match the reusable workflow SHA.
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      # Shared: dispatch selects its SHA; PR/push use the event's exact revision.
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      # Project: preserve Dripperz's supported Node version, not a shared default.
      node_version: 24.21.0
  # Shared: verification must succeed; only main push/manual dev runs can deploy.
  # The called job binds dev, checks artifact integrity/freshness without an opt-in and
  # serializes mutations without cancelling active delivery. Production stays gated.
  # Project: scripts/ci-deploy.mjs retains the bounded static delivery controller,
  # isolated Vercel projects, upload guards, identity/routing smoke and evidence.
  # Production is a separate manual entry point in deploy-production.yml.
  deploy_dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: 24.21.0
    # Shared: pass named provider secrets only, never to verification jobs.
    # Target environment values/credentials are resolved in the called deploy job.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
  # Project: preserve existing branch-protection check names during adoption.
  # Shared: always() reports verification failures instead of hiding them behind
  # a skipped check. These jobs mirror verify's result; they do not repeat tests.
  legacy_0:
    name: Quality and build
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
  legacy_1:
    name: Browser smoke
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
